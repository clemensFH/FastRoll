[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# Not needed to compile: it keeps the reference Gateway at 17.3 KB rather than
# 20.3 KB of the 24 KB contract size limit, which leaves room for your own
# proofs in Task 3. It makes compiling slower. Frozen like the rest of this
# file, because the grader builds with it.
via_ir = true
fs_permissions = [{ access = "read", path = "./spec/vectors" }]

[fmt]
line_length = 110
tab_width = 4
